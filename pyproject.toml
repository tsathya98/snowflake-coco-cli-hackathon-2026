[project]
name = "warrant"
version = "0.1.0"
description = "A governed autonomous operations agent on Snowflake"
requires-python = ">=3.11"
dependencies = [
    "snowflake-snowpark-python>=1.24.0",
    "snowflake-connector-python>=3.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Build-time only: renders corpus/*.md into the PDFs the pipeline parses.
    # Not a runtime dependency — nothing under src/warrant imports it, and
    # provisioning uses the committed output rather than re-rendering.
    "fpdf2>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The organizer states the repository is statically analysed for code quality, security,
# efficiency, testing and accessibility, so the ruleset is chosen to cover those rather than to
# be comfortable. Each family below earns its place:
#   BLE  bare `except Exception` must be deliberate and annotated — the console relies on exactly
#        one, and RUF100 keeps that suppression honest by failing if it stops being needed.
#   C90  cyclomatic complexity, capped at 10.
#   PERF/DTZ/LOG  efficiency, naive datetimes, and logging call shape.
#   SLF  no reaching into another object's private attributes.
#   TRY300  a `return` in a `try` must not sit under a handler it does not need.
#   RUF100  a `noqa` that no longer suppresses anything is a comment claiming a problem that is
#           not there; four had accumulated in tools/lint_sql_boundary.py.
select = [
    "E", "F", "I", "N", "UP", "B", "S", "A", "C4", "RET", "SIM", "PTH",
    "BLE", "C90", "PERF", "DTZ", "PIE", "LOG", "SLF", "TRY300", "RUF100",
]
ignore = ["S101"]  # assert is the point of a test

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
# There is a streamlit/ directory in the repo, which otherwise makes ruff classify the
# streamlit package itself as first-party.
known-third-party = ["streamlit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live Snowflake connection",
]
# Integration tests need a warehouse, so they are opt-in: `uv run pytest -m integration`.
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["src/warrant"]
branch = true

[tool.coverage.report]
# The pipeline is unit-testable end to end because every function takes its Session as an
# argument rather than discovering one. That design choice is what makes this gate
# achievable rather than aspirational, so the gate is what keeps the design honest.
fail_under = 100
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["src/warrant"]
strict = true
# Neither snowflake-snowpark-python nor the connector ships complete type information.
[[tool.mypy.overrides]]
module = ["snowflake.*"]
ignore_missing_imports = true
